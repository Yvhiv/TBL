<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>مراجعة TBL — بنك الأسئلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0b1120; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#eef2ff; --mut:#9aa6c4; --dim:#6b7694;
  --teal:#2dd4bf; --violet:#8b5cf6; --amber:#fbbf24; --rose:#fb7185; --green:#34d399;
  --grad:linear-gradient(120deg,#2dd4bf,#60a5fa 55%,#8b5cf6);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
[lang=en]{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif}
/* ---------- backdrop ---------- */
.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 600px at 85% -10%,rgba(139,92,246,.20),transparent 60%),
  radial-gradient(800px 600px at -15% 25%,rgba(45,212,191,.14),transparent 60%),
  radial-gradient(700px 700px at 60% 110%,rgba(96,165,250,.12),transparent 60%),
  var(--bg);}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 75%);}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.35;pointer-events:none}
.orb.a{width:340px;height:340px;background:#8b5cf6;top:-120px;inset-inline-start:-100px;animation:drift 22s ease-in-out infinite alternate}
.orb.b{width:300px;height:300px;background:#2dd4bf;top:30%;inset-inline-end:-140px;animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,60px) scale(1.12)}}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
/* ---------- home ---------- */
.hero{padding:56px 0 8px;text-align:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--teal);
  background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.25);border-radius:999px;padding:7px 16px;
  animation:pop .7s cubic-bezier(.2,.9,.3,1.4) both}
.hero h1{font-size:clamp(34px,8vw,52px);font-weight:900;line-height:1.25;margin:18px 0 10px;
  animation:rise .8s .1s cubic-bezier(.2,.8,.3,1) both}
.hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:16px;margin:0 auto 22px;max-width:420px;line-height:1.9;
  animation:rise .8s .2s cubic-bezier(.2,.8,.3,1) both}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:rise .8s .3s cubic-bezier(.2,.8,.3,1) both}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 18px;backdrop-filter:blur(8px)}
.stat b{font-size:20px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--mut);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 2px 14px}
.sect-head h2{font-size:20px;font-weight:800;margin:0}
.sect-head span{font-size:12.5px;color:var(--dim);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:1fr;padding-bottom:40px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;text-align:start;cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r);padding:18px 18px 16px;backdrop-filter:blur(10px);overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .25s,box-shadow .25s;
  font-family:inherit;color:inherit;width:100%;display:block;
  animation:rise .6s both}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.card:active{transform:translateY(-1px) scale(.99)}
.card .ghost{position:absolute;top:-14px;inset-inline-end:8px;font-size:74px;font-weight:900;color:rgba(255,255,255,.05);line-height:1;pointer-events:none}
.card .tag{position:absolute;top:14px;inset-inline-end:14px;font-size:11px;font-weight:800;color:#0b1120;
  background:linear-gradient(120deg,#fbbf24,#f59e0b);border-radius:999px;padding:3px 10px}
.card h3{margin:0 0 2px;font-size:18px;font-weight:800}
.card .en{color:var(--dim);font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:14px}
.chip{font-size:11.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.best{color:var(--amber);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width 1s cubic-bezier(.2,.8,.3,1)}
.sub-head{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sub-head b{font-size:17px;font-weight:800}
.sub-head span{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.sub-head em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--mut);font-weight:700}
#groups .grid{padding-bottom:12px}
#groups .grid:last-child{padding-bottom:40px}
/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,7,15,.7);backdrop-filter:blur(6px);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line2);border-bottom:none;
  border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.overlay.on .sheet{transform:none}
.sheet h3{margin:0 0 2px;font-size:21px;font-weight:900}
.sheet .en{color:var(--dim);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sheet .opts{margin:18px 0 6px;display:grid;gap:9px}
.sopt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);
  background:var(--card);border-radius:15px;padding:12px 15px;cursor:pointer;transition:border-color .2s,background .2s;width:100%;font-family:inherit;color:inherit;text-align:start}
.sopt.sel{border-color:var(--teal);background:rgba(45,212,191,.09)}
.sopt b{font-size:14.5px;font-weight:800}
.sopt small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:1px}
.sopt .radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--line2);flex:none;position:relative;transition:border-color .2s}
.sopt.sel .radio{border-color:var(--teal)}
.sopt.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--teal)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:16.5px;color:#06121a;border-radius:16px;padding:15px;
  background:var(--grad);transition:transform .2s,box-shadow .2s;box-shadow:0 12px 30px -10px rgba(45,212,191,.45)}
.btn:active{transform:scale(.98)}
.btn.ghost2{background:var(--card2);color:var(--txt);border:1px solid var(--line2);box-shadow:none;font-weight:800}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{margin-top:0}
/* ---------- quiz ---------- */
.qtop{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 0 10px}
.qtop .row{display:flex;align-items:center;gap:12px}
.iconbtn{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .2s}
.iconbtn:active{background:var(--card2)}
.qtop .mid{flex:1;min-width:0}
.qtop .mid b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .mid span{font-size:11.5px;color:var(--dim);font-weight:700}
.qcount{font-size:13px;font-weight:800;color:var(--mut);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;flex:none}
.qprog{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.qbody{padding:22px 0 120px}
.stem{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.28);border-radius:18px;
  padding:14px 16px;margin-bottom:16px;animation:rise .45s both}
.stem .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#c4b5fd;margin-bottom:6px}
.stem p{margin:0;font-size:14.5px;line-height:1.85;color:#ddd6fe}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;
  backdrop-filter:blur(10px);animation:qin .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes qin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.qcard.out{animation:qout .22s ease both}
@keyframes qout{to{opacity:0;transform:translateY(-12px)}}
.qnum{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.5px;margin-bottom:8px}
.qtext{margin:0 0 18px;font-size:17.5px;font-weight:700;line-height:1.75}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;cursor:pointer;
  border:1.5px solid var(--line);background:rgba(255,255,255,.03);border-radius:15px;padding:13px 14px;
  margin-bottom:9px;font-family:inherit;color:var(--txt);font-size:15px;line-height:1.6;
  transition:border-color .2s,background .2s,transform .15s;animation:rise .4s both}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}
.opt:nth-child(4){animation-delay:.12s}.opt:nth-child(5){animation-delay:.16s}.opt:nth-child(6){animation-delay:.2s}
.opt:not(:disabled):active{transform:scale(.985)}
.opt .ltr{display:flex;align-items:center;gap:12px;direction:ltr;text-align:left;width:100%}
.opt .L{flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:all .2s}
.opt:disabled{cursor:default}
.opt.hit{border-color:rgba(52,211,153,.65);background:rgba(52,211,153,.1)}
.opt.hit .L{background:var(--green);border-color:var(--green);color:#06121a}
.opt.miss{border-color:rgba(251,113,133,.65);background:rgba(251,113,133,.1);animation:shake .4s}
.opt.miss .L{background:var(--rose);border-color:var(--rose);color:#1a0609}
.opt.picked{border-color:rgba(96,165,250,.6);background:rgba(96,165,250,.1)}
.opt.picked .L{background:#60a5fa;border-color:#60a5fa;color:#06121a}
.opt.faded{opacity:.45}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.verdict{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 15px;margin-top:4px;
  font-weight:800;font-size:14.5px;animation:pop .4s cubic-bezier(.2,.9,.3,1.5) both}
.verdict.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.verdict.no{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4);color:#fda4af}
.verdict.na{background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.3);color:#a8b3c7;font-size:13px;font-weight:700;line-height:1.7}
.qfoot{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(7,11,20,.92) 30%);pointer-events:none}
.qfoot .wrap{pointer-events:auto;padding:0}
.streak{position:fixed;top:76px;inset-inline-start:16px;z-index:25;display:flex;align-items:center;gap:6px;
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--amber);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:900;animation:pop .35s cubic-bezier(.2,.9,.3,1.5) both}
/* ---------- results ---------- */
.res{padding:44px 0 60px;text-align:center}
.ring{position:relative;width:172px;height:172px;margin:6px auto 4px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .fill{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.3,1)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:42px;font-weight:900;line-height:1}
.ring .val span{font-size:12.5px;color:var(--mut);font-weight:700;margin-top:4px}
.res h2{font-size:26px;font-weight:900;margin:14px 0 6px}
.res .sub{color:var(--mut);font-size:14.5px;font-weight:600;margin:0 0 20px}
.tally{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.tally .t{min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px}
.tally .t b{display:block;font-size:22px;font-weight:900}
.tally .t span{font-size:11.5px;color:var(--mut);font-weight:700}
.t.g b{color:var(--green)}.t.r b{color:var(--rose)}.t.n b{color:var(--dim)}
.mistakes{text-align:start;margin-top:26px}
.mistakes h3{font-size:17px;font-weight:900;margin:0 2px 12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.mcard .q{font-size:14.5px;font-weight:700;line-height:1.7;margin:0 0 10px}
.mcard .a{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6;margin-top:6px}
.mcard .a .L{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11.5px}
.mcard .a.you{color:#fda4af}.mcard .a.you .L{background:rgba(251,113,133,.2);color:#fda4af}
.mcard .a.cor{color:#6ee7b7}.mcard .a.cor .L{background:rgba(52,211,153,.2);color:#6ee7b7}
.note{font-size:12.5px;color:var(--dim);font-weight:600;margin-top:18px;line-height:1.8}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bank-sep{height:1px;margin:44px 8px 34px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="bg"></div>
<div class="orb a"></div><div class="orb b"></div>

<!-- ============ HOME ============ -->
<section id="home">
  <div class="wrap">
    <header class="hero">
      <h1>مراجعة <span class="g" lang="en">TBL</span><br>بطريقة تفتح النفس</h1>
      <p id="heroP"></p>
      <div class="stats">
        <div class="stat"><b id="stQ">٢٤١</b><span>سؤال</span></div>
        <div class="stat"><b id="stS">٩</b><span>أقسام</span></div>
        <div class="stat"><b id="stB">—</b><span>أفضل نتيجة</span></div>
      </div>
    </header>
    <div id="groups"></div>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section id="quiz" hidden>
  <div class="qtop"><div class="wrap">
    <div class="row">
      <button class="iconbtn" id="qBack" aria-label="رجوع">→</button>
      <div class="mid"><b id="qSecAr"></b><span id="qSecEn" lang="en" dir="ltr"></span></div>
      <span class="qcount" id="qCount"></span>
    </div>
    <div class="qprog"><i id="qProg"></i></div>
  </div></div>
  <div class="wrap qbody">
    <div id="stemBox"></div>
    <div class="qcard" id="qcard">
      <div class="qnum" id="qNum"></div>
      <p class="qtext" id="qText" lang="en" dir="ltr"></p>
      <div id="opts"></div>
      <div id="verdict"></div>
    </div>
  </div>
  <div class="qfoot"><div class="wrap">
    <button class="btn" id="nextBtn" hidden></button>
  </div></div>
  <div id="streakBox"></div>
</section>

<!-- ============ RESULT ============ -->
<section id="result" hidden>
  <div class="wrap res">
    <div class="ring">
      <svg width="172" height="172" viewBox="0 0 172 172">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient></defs>
        <circle class="track" cx="86" cy="86" r="74" fill="none" stroke-width="13"/>
        <circle class="fill" id="ringFill" cx="86" cy="86" r="74" fill="none" stroke-width="13"
          stroke-dasharray="465" stroke-dashoffset="465"/>
      </svg>
      <div class="val"><b id="resPct">٠٪</b><span id="resFrac"></span></div>
    </div>
    <h2 id="resTitle"></h2>
    <p class="sub" id="resSub"></p>
    <div class="tally" id="tally"></div>
    <div class="btnrow" style="max-width:460px;margin:0 auto">
      <button class="btn" id="btnMist" hidden>راجع غلطاتك</button>
      <button class="btn ghost2" id="btnRetry">أعد القسم</button>
      <button class="btn ghost2" id="btnHome">الرئيسية</button>
    </div>
    <div class="mistakes" id="mistBox"></div>
    <p class="note" id="resNote"></p>
  </div>
</section>

<!-- ============ SHEET ============ -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="shAr"></h3><span class="en" id="shEn" lang="en" dir="ltr"></span>
    <div class="opts" id="shOpts"></div>
    <div class="btnrow">
      <button class="btn ghost2" id="shCancel">إلغاء</button>
      <button class="btn" id="shGo">ابدأ الحل 🚀</button>
    </div>
  </div>
</div>

<script>

<script>
'use strict';
const $=s=>document.querySelector(s);
const ARD=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

let S={sec:null,qs:[],i:0,answers:[],submitted:false,ok:0,bad:0,na:0,wrong:[]};

/* ---------- home ---------- */
function secCard(sec,idx,st){
  const best=st['best_'+sec.id];
  const b=document.createElement('button');
  b.className='card';b.style.animationDelay=(Math.min(idx,8)*0.05)+'s';
  b.innerHTML=`<span class="ghost">${toAr(idx+1)}</span>
    <h3>${sec.ar}</h3><div class="en" lang="en" dir="ltr">${sec.title}</div>
    <div class="meta"><span class="chip">${toAr(sec.questions.length)} سؤال</span>
    ${best!=null?`<span class="chip best">أفضل نتيجة ${toAr(best)}٪</span>`:''}</div>
    <div class="pbar"><i data-w="${best||0}"></i></div>`;
  b.onclick=()=>openSheet(sec);
  return b;
}
function buildHome(){
  const root=$('#groups');root.innerHTML='';
  const st=store.get();
  let bestAll=null,totalQ=0,totalS=0;
  const cnt=a=>a.reduce((n,s)=>n+s.questions.length,0);
  const addGrid=secs=>{
    const g=document.createElement('div');g.className='grid';
    secs.forEach((sec,idx)=>{
      const best=st['best_'+sec.id];
      if(best!=null&&(bestAll==null||best>bestAll))bestAll=best;
      totalQ+=sec.questions.length;totalS++;
      g.appendChild(secCard(sec,idx,st));
    });
    root.appendChild(g);
  };
  const head=(t,s)=>{const h=document.createElement('div');h.className='sect-head';h.innerHTML=`<h2>${t}</h2><span>${s}</span>`;root.appendChild(h);};
  addGrid(DATA);
  const sep=document.createElement('div');sep.className='bank-sep';root.appendChild(sep);
  [['تشريح','Anatomy'],['هستولوجي','Histology'],['فسيولوجي','Physiology']].forEach(([ar,en])=>{
    const secs=DATA2.filter(s=>s.sub===en);
    const h=document.createElement('div');h.className='sub-head';
    h.innerHTML=`<b>${ar}</b><em>${toAr(cnt(secs))} سؤال</em>`;
    root.appendChild(h);addGrid(secs);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.pbar i').forEach(i=>i.style.width=i.dataset.w+'%');
  }));
  $('#stB').textContent=bestAll==null?'—':toAr(bestAll)+'٪';
  $('#stQ').textContent=toAr(totalQ);$('#stS').textContent=toAr(totalS);
  $('#heroP').textContent=toAr(totalQ)+' سؤال بتصحيح بعد ما تسلّم، ومراجعة للغلطات.';
}

/* ---------- start sheet ---------- */
let sheetSec=null,sheetMode='all';
function openSheet(sec){
  sheetSec=sec;sheetMode='all';
  $('#shAr').textContent=sec.ar;$('#shEn').textContent=sec.title;
  const o=$('#shOpts');o.innerHTML='';
  const mk=(mode,title,sub)=>{
    const b=document.createElement('button');
    b.className='sopt'+(mode===sheetMode?' sel':'');
    b.innerHTML=`<span><b>${title}</b><small>${sub}</small></span><span class="radio"></span>`;
    b.onclick=()=>{sheetMode=mode;[...o.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');};
    o.appendChild(b);return b;
  };
  mk('all','الأسئلة كلها بالترتيب',toAr(sec.questions.length)+' سؤال');
  mk('shuffle','الأسئلة كلها مخلوطة','نفس الأسئلة بترتيب عشوائي');
  mk('ten','١٠ أسئلة عشوائية','جولة سريعة على الماشي');
  $('#overlay').classList.add('on');
}
$('#shCancel').onclick=()=>$('#overlay').classList.remove('on');
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')$('#overlay').classList.remove('on');});
$('#shGo').onclick=()=>{
  $('#overlay').classList.remove('on');
  let qs=[...sheetSec.questions];
  if(sheetMode==='shuffle')shuffle(qs);
  if(sheetMode==='ten'){shuffle(qs);qs=qs.slice(0,10);}
  startQuiz(sheetSec,qs);
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

/* ---------- quiz ---------- */
function show(id){['home','quiz','result'].forEach(v=>$('#'+v).hidden=v!==id);window.scrollTo(0,0);}
function startQuiz(sec,qs){
  S={sec,qs:qs.map(q=>({...q,opts:q.opts.map(p=>[...p])})),i:0,answers:[],submitted:false,ok:0,bad:0,na:0,wrong:[]};
  lastStem=null;
  $('#qSecAr').textContent=sec.ar;$('#qSecEn').textContent=sec.title;
  show('quiz');renderQ();
}
let lastStem=null;
function renderQ(){
  const q=S.qs[S.i],card=$('#qcard');
  card.classList.remove('out');card.style.animation='none';void card.offsetWidth;card.style.animation='';
  $('#qCount').textContent=toAr(S.i+1)+' / '+toAr(S.qs.length);
  $('#qProg').style.width=((S.i)/S.qs.length*100)+'%';
  $('#qNum').textContent='السؤال '+toAr(S.i+1)+(S.sec.id==='s8'?' · حالة '+toAr(q.n):'');
  $('#qText').textContent=q.q;
  const sb=$('#stemBox');
  if(q.stem){lastStem=q.stem;}
  if(q.stem|| (S.sec.id==='s8'&&lastStem)){
    sb.innerHTML=`<div class="stem"><span class="lbl">📋 الحالة</span><p lang="en" dir="ltr">${esc(q.stem||lastStem)}</p></div>`;
  }else sb.innerHTML='';
  const box=$('#opts');box.innerHTML='';$('#verdict').innerHTML='';$('#nextBtn').hidden=true;
  q.opts.forEach(([L,text])=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="ltr"><span class="L">${L}</span><span lang="en">${esc(text)}</span></span>`;
    b.onclick=()=>pick(b,L,q);
    box.appendChild(b);
  });
  const prev=S.answers[S.i];
  if(prev!=null){
    [...box.children].forEach(o=>{if(o.querySelector('.L').textContent===prev)o.classList.add('picked');});
    const nb=$('#nextBtn');
    nb.textContent=S.i+1<S.qs.length?'السؤال اللي بعده ←':'سلّم الامتحان 🏁';
    nb.hidden=false;
  }
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(btn,L,q){
  if(S.submitted)return;
  const opts=[...document.querySelectorAll('#opts .opt')];
  opts.forEach(o=>o.classList.remove('picked'));
  btn.classList.add('picked');
  S.answers[S.i]=L;
  $('#qProg').style.width=((S.i+1)/S.qs.length*100)+'%';
  const nb=$('#nextBtn');
  nb.textContent=S.i+1<S.qs.length?'السؤال اللي بعده ←':'سلّم الامتحان 🏁';
  nb.hidden=false;
}
$('#nextBtn').onclick=()=>{
  if(S.i+1>=S.qs.length){finish();return;}
  const card=$('#qcard');card.classList.add('out');
  setTimeout(()=>{S.i++;renderQ();window.scrollTo({top:0,behavior:'smooth'});},180);
};
$('#qBack').onclick=()=>{buildHome();show('home');};

/* ---------- results ---------- */
function finish(){
  S.submitted=true;
  S.ok=0;S.bad=0;S.na=0;S.wrong=[];
  S.qs.forEach((q,idx)=>{
    const L=S.answers[idx];
    if(q.unkeyed){S.na++;return;}
    if(L===q.ans)S.ok++;
    else{S.bad++;S.wrong.push({q,pick:L});}
  });
  const graded=S.ok+S.bad;
  const pct=graded?Math.round(S.ok/graded*100):0;
  const st=store.get();
  const key='best_'+S.sec.id;
  if(graded&&(st[key]==null||pct>st[key])){st[key]=pct;store.set(st);}
  $('#resPct').textContent=toAr(pct)+'٪';
  $('#resFrac').textContent=toAr(S.ok)+' من '+toAr(graded);
  const [lo,title,sub]=GRADES.find(g=>pct>=g[0]);
  $('#resTitle').textContent=title;$('#resSub').textContent=sub;
  $('#tally').innerHTML=
    `<div class="t g"><b>${toAr(S.ok)}</b><span>صح</span></div>
     <div class="t r"><b>${toAr(S.bad)}</b><span>غلط</span></div>`+
    (S.na?`<div class="t n"><b>${toAr(S.na)}</b><span>غير متصحح</span></div>`:'');
  const fill=$('#ringFill');fill.style.transition='none';fill.style.strokeDashoffset=465;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fill.style.transition='';fill.style.strokeDashoffset=465*(1-pct/100);
  }));
  const mb=$('#mistBox');mb.innerHTML='';
  if(S.wrong.length){
    mb.innerHTML='<h3>غلطاتك في الجولة دي</h3>';
    S.wrong.forEach(({q,pick})=>{
      const get=L=>{const o=q.opts.find(p=>p[0]===L);return o?o[1]:'';};
      const d=document.createElement('div');d.className='mcard';
      d.innerHTML=`<p class="q" lang="en" dir="ltr">${esc(q.q)}</p>
        <div class="a you"><span class="L">${pick}</span><span lang="en" dir="ltr">إجابتك: ${esc(get(pick))}</span></div>
        <div class="a cor"><span class="L">${q.ans}</span><span lang="en" dir="ltr">الصح: ${esc(get(q.ans))}</span></div>`;
      mb.appendChild(d);
    });
  }
  $('#btnMist').hidden=!S.wrong.length;
  $('#resNote').textContent=S.na?'في '+toAr(S.na)+' من الأسئلة دي مفتاح الملف مفيهوش إجابتها (منها سؤال ملغي)، فسيبناها من غير درجة زي ما طلبت.':'';
  show('result');
  if(pct>=80&&graded>0)confetti();
}
$('#btnRetry').onclick=()=>startQuiz(S.sec,[...S.sec.questions]);
$('#btnHome').onclick=()=>{buildHome();show('home');};
$('#btnMist').onclick=()=>{
  const qs=S.wrong.map(w=>S.sec.questions.find(q=>q.n===w.q.n)).filter(Boolean);
  startQuiz(S.sec,qs);
};

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#2dd4bf','#60a5fa','#8b5cf6','#fbbf24','#34d399','#fb7185'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,
    w:6+Math.random()*7,h:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],
    vy:2+Math.random()*3.2,vx:-1.4+Math.random()*2.8,r:Math.random()*Math.PI,vr:-.12+Math.random()*.24}));
  const t0=performance.now();
  (function tick(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t-t0<2800)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })(t0);
}
buildHome();
</script>
